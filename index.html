<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}

main{max-width:920px;margin:auto;padding:13px 13px 98px}.view{display:none}.view.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:14px}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#fff8ee,#fffdf9);color:var(--ink);border:1px solid #f4dcc2}.hero .big{font-size:22px;font-weight:900}.hero .sub{color:var(--muted);margin-top:4px;font-size:13px}.heroStats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-top:1px solid #f2dfcc;padding-top:13px}.heroStats div{text-align:center}.heroStats b{display:block;font-size:21px;color:var(--red)}.heroStats span{font-size:11px;color:var(--muted)}.section{display:flex;justify-content:space-between;align-items:center;margin:18px 3px 9px}.section h2{font-size:18px;margin:0}.link{border:0;background:transparent;color:var(--red);font-weight:800}.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.q{background:#fff;border:1px solid var(--line);border-radius:17px;min-height:96px;padding:12px 8px;box-shadow:var(--shadow);font-weight:800;color:#202226}.q .ico{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;margin:0 auto 8px;background:#fff1e3;color:var(--red);font-size:20px}.q.locked{opacity:.42;filter:grayscale(.2)}
.list{display:flex;flex-direction:column;gap:9px}.item{background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px 13px;box-shadow:0 5px 18px rgba(0,0,0,.035)}.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.item b{font-size:15px}.meta{font-size:12px;color:var(--muted);margin-top:4px}.amount{font-weight:900;color:var(--red);white-space:nowrap}.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:#f1f1ef;color:#54585f}.tag.green{background:#e8f6ed;color:var(--green)}.tag.red{background:#fff1e3;color:var(--red)}.tag.amber{background:#fff5de;color:var(--amber)}.btn{border:0;border-radius:13px;padding:11px 13px;font-weight:850;background:var(--ink);color:#fff}.btn.red{background:var(--red)}.btn.green{background:var(--green)}.btn.light{background:#f3f1ef;color:#222}.btn.outline{background:#fff;color:var(--red);border:1px solid #f3a79c}.btn.sm{padding:7px 9px;font-size:12px}.actions{display:flex;gap:8px;margin-top:12px}.actions .btn{flex:1}.filters{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.chip{border:1px solid var(--line);background:#fff;color:#333;padding:9px 13px;border-radius:999px;font-weight:800;white-space:nowrap}.chip.active{background:var(--red);color:#fff;border-color:var(--red)}
.search{display:flex;gap:8px}.search input{flex:1}.search .btn{flex:0 0 auto}.empty{padding:28px 10px;text-align:center;color:var(--muted)}.notice{border-radius:15px;padding:11px 12px;background:#fff5e8;border:1px solid #f3d2aa;color:#70441f;font-size:13px}.notice.info{background:#eff6ff;border-color:#cfe0ff;color:#254b7b}.notice.ok{background:#edf9f1;border-color:#c9efd6;color:#24643b}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);backdrop-filter:blur(12px)}nav button{border:0;background:transparent;color:#777;font-size:11px;padding:4px 2px}nav .ni{display:block;font-size:20px;margin-bottom:2px}nav button.active{color:var(--red);font-weight:900}.fab{width:56px;height:56px;margin-top:-22px;border-radius:50%;background:var(--red)!important;color:#fff!important;font-size:30px!important;box-shadow:0 9px 26px rgba(243,106,0,.30)}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(18,18,18,.45);display:none;align-items:flex-end}.overlay.show{display:flex}.sheet{width:100%;max-height:94vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:15px 14px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -15px 40px rgba(0,0,0,.2)}.sheetHead{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-15px;background:#fff;padding:8px 0 10px;z-index:2}.sheetHead h3{margin:0;font-size:20px}.x{width:38px;height:38px;border:0;border-radius:50%;background:#f3f1ef;font-size:20px}.block{background:#faf9f8;border:1px solid var(--line);border-radius:17px;padding:12px;margin:10px 0}.block h4{margin:0 0 9px;font-size:14px;color:#3b3d42}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:block;font-size:12px;color:#555b65;font-weight:800;margin:9px 0 5px}input,select,textarea{width:100%;border:1px solid #ddd9d6;border-radius:12px;padding:11px 12px;background:#fff;color:#222;outline:none}input:focus,select:focus,textarea:focus{border-color:#f4a35e;box-shadow:0 0 0 3px rgba(243,106,0,.09)}textarea{min-height:82px;resize:vertical}.fieldwrap{display:flex;gap:7px}.fieldwrap input,.fieldwrap textarea{flex:1}.mic{width:48px;flex:0 0 48px;border:0;border-radius:12px;background:#fff1e3;color:var(--red);font-size:20px}.permgrid{display:grid;grid-template-columns:1fr;gap:8px}.perm{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);padding:10px 11px;border-radius:13px}.perm span{font-size:13px;font-weight:700}.perm input{width:22px;height:22px}.hidden{display:none!important}.syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#aaa;margin-right:5px}.syncdot.on{background:#16a34a}.syncdot.err{background:#dc2626}.stockgrid{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.dangerline{border-color:#ffc3ba;background:#fffafa}.attendance{display:grid;grid-template-columns:1fr 1fr;gap:9px}.attendance .btn{padding:15px 10px}.attendance .btn:disabled{opacity:.45}.printGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.printBtn{border:1px solid var(--line);border-radius:15px;background:#fff;padding:13px;font-weight:900}.printBtn b{display:block;font-size:13px}.printBtn span{font-size:11px;color:var(--muted)}

.ticket{border:1px solid #cfc9c5;border-radius:10px;overflow:hidden;background:#fff}
.ticketTitle{text-align:center;font-weight:950;padding:10px;border-bottom:1px solid #cfc9c5;background:#faf9f8}
.ticketrow{display:grid;grid-template-columns:105px 1fr;border-bottom:1px solid #d9d4d0;min-height:42px}
.ticketrow:last-child{border-bottom:0}.ticketrow .k{font-weight:900;padding:9px;border-right:1px solid #d9d4d0;background:#faf9f8}.ticketrow .v{padding:9px;white-space:pre-wrap}
.ticketrow.two{grid-template-columns:105px 1fr 78px 1fr}.ticketrow.two .k:nth-child(3){border-left:1px solid #d9d4d0}
.cancelBox{border:1px solid #ffc3ba;background:#fff3f1;color:#8b2d21;border-radius:14px;padding:11px 12px;margin:10px 0}
.printerCard{border:1px dashed #ef9a8d;background:#fff8f6;border-radius:16px;padding:12px}.printerCard b{display:block;margin-bottom:4px}

@media(max-width:540px){.quick{grid-template-columns:repeat(3,1fr)}.q{min-height:91px;font-size:12px}.top{align-items:flex-start}.logoBox{width:98px}.userpill{max-width:145px}.twocol{grid-template-columns:1fr}.heroStats b{font-size:18px}}

<header><div class="top"><div class="brand"><div class="logoBox" id="logoBox"></div><div><b style="display:block;font-size:16px">Cep Asistanı</b><span id="syncStatus" class="meta"><span class="syncdot"></span>Bulut bağlantısı kapalı</span></div></div><button class="userpill" onclick="openLogin()">👤 <span id="userLabel">Giriş yap</span></button></div></header>
<main>
<section id="homeView" class="view active">
  <div id="attendanceCard"></div>
  <div class="card hero" style="margin-top:10px"><div class="big" id="helloText">Onur Teknik</div><div class="sub" id="todayText"></div><div class="heroStats"><div><b id="hsAppt">0</b><span>Bugünkü Randevu</span></div><div><b id="hsDone">0</b><span>Tamamlanan</span></div><div><b id="hsPending">0</b><span>Bekleyen</span></div></div></div>
  <div class="section"><h2>Hızlı İşlemler</h2><button class="link" onclick="openQuickAdd()">+ Yeni</button></div>
  <div class="quick" id="quickGrid"></div>
  <div class="section"><h2>Bugünkü Randevular</h2><button class="link" onclick="switchView('appointments')">Tümünü gör</button></div>
  <div class="list" id="homeAppointments"></div>
</section>
<section id="appointmentsView" class="view"><div class="section"><h2>Randevular</h2><button class="btn red sm" id="newAppointmentBtn" onclick="openAppointmentForm()">+ Randevu</button></div><div class="filters" id="appointmentFilters"><button class="chip active" onclick="setApptFilter('today',this)">Bugün</button><button class="chip" onclick="setApptFilter('upcoming',this)">Yaklaşan</button><button class="chip" onclick="setApptFilter('cancelled',this)">İptal</button><button class="chip" onclick="setApptFilter('all',this)">Tümü</button></div><div class="list" id="appointmentList" style="margin-top:10px"></div></section>
<section id="servicesView" class="view"><div class="section"><h2>Servis Kayıtları</h2><button class="btn red sm" onclick="openStandaloneService()">+ Servis</button></div><div class="filters" id="serviceFilters" style="margin-bottom:9px"><button class="chip active" onclick="setServiceFilter('all',this)">Tümü</button><button class="chip" onclick="setServiceFilter('today',this)">Bugün</button><button class="chip" onclick="setServiceFilter('month',this)">Bu Ay</button></div><div class="search"><input id="serviceSearch" placeholder="Müşteri, telefon, servis no ara"><button class="btn" onclick="renderServices()">Ara</button></div><div class="list" id="serviceList" style="margin-top:10px"></div></section>
<section id="stockView" class="view"><div class="section"><h2>Araç / Depo Stok</h2><button class="btn red sm" id="newStockBtn" onclick="openStockForm()">+ Parça</button></div><div id="stockList" class="list"></div></section>
<section id="moreView" class="view"><div class="section"><h2>Diğer</h2></div><div class="quick" id="moreGrid"></div><div id="adminArea" style="margin-top:14px"></div></section>
</main>
<nav><button data-v="home" class="active" onclick="switchView('home')"><span class="ni">⌂</span>Ana Ekran</button><button data-v="appointments" onclick="switchView('appointments')"><span class="ni">▣</span>Randevular</button><button class="fab" onclick="openQuickAdd()">+</button><button data-v="services" onclick="switchView('services')"><span class="ni">▤</span>Kayıtlar</button><button data-v="more" onclick="switchView('more')"><span class="ni">⋯</span>Diğer</button></nav>

function formVal(id){return document.getElementById(id)?.value?.trim()||''}function numVal(id){return Number(document.getElementById(id)?.value||0)}
function openSheet(title,html){sheetTitle.textContent=title;sheetBody.innerHTML=html;overlay.classList.add('show')}function closeSheet(){overlay.classList.remove('show')}
function voiceField(id){
 const el=document.getElementById(id);if(el)el.focus();
 try{
   if(window.AndroidVoice&&typeof window.AndroidVoice.startVoiceInput==='function'){
     window.AndroidVoice.startVoiceInput(id);return;
   }
 }catch{}
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){alert('Bu cihazda uygulama içi mikrofon henüz açılamadı. Android uygulamasında yeni mikrofon köprüsü kullanılacak; geçici olarak klavye mikrofonu kullanılabilir.');return}
 try{const r=new SR();r.lang='tr-TR';r.interimResults=false;r.maxAlternatives=1;r.onresult=e=>{const tx=e.results?.[0]?.[0]?.transcript||'';receiveVoiceText(id,tx)};r.onerror=()=>alert('Mikrofon sesi alınamadı. Tekrar deneyin.');r.start()}catch{alert('Mikrofon başlatılamadı.')}
}
function receiveVoiceText(id,text){const el=document.getElementById(id);if(!el||!text)return;el.value=(el.value?el.value+' ':'')+String(text).trim();el.dispatchEvent(new Event('input',{bubbles:true}))}
function micInput(id,type='text',ph=''){const tag=type==='textarea'?'textarea':'input';return `<div class="fieldwrap"><${tag} id="${id}" ${tag==='input'?`type="${type}"`:''} placeholder="${ph}"></${tag}><button class="mic" type="button" onclick="voiceField('${id}')">🎙️</button></div>`}
function announce(msg){if(!state.settings.voiceNotifications||!msg)return;try{if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(msg);u.lang='tr-TR';u.rate=Number(state.settings.voiceRate||1);const all=speechSynthesis.getVoices()||[];const tr=all.filter(v=>String(v.lang||'').toLowerCase().startsWith('tr'));const femaleHints=['emel','selma','filiz','aylin','female','kadın','kadin','zeynep'];const preferred=tr.find(v=>femaleHints.some(h=>String(v.name||'').toLocaleLowerCase('tr-TR').includes(h)));const pick=all.find(v=>v.name===state.settings.voiceName)||preferred||tr[0]||all[0];if(pick)u.voice=pick;speechSynthesis.speak(u)}}catch{}}
function humanWhen(a){const d=a.date===todayKey()?'bugün':a.date===addDaysKey(1)?'yarın':a.date;return [d,a.time?`saat ${a.time.replace('–',' ile ')}`:''].filter(Boolean).join(' ')}
function shortAppointmentAnnouncement(a){return `Yeni randevu oluşturuldu. ${titleTR(a.customerName||'')}. ${titleTR(a.deviceBrand||'')} ${a.type||'servis'}. ${a.issue||''}. ${cleanAddress(a.address||'')}. ${humanWhen(a)}.`;}

function openLogin(){const buttons=state.employees.filter(e=>e.active).map(e=>`<button class="btn ${e.role==='admin'?'red':'light'}" onclick="chooseLogin('${e.id}')">${e.role==='admin'?'🔐':'👤'} ${esc(e.name)}</button>`).join('');openSheet('Kullanıcı Seç',`<div class="notice info">Her personel kendi hesabıyla giriş yapar. Hangi menüleri görebileceğini yönetici belirler.</div><div class="actions" style="flex-direction:column">${buttons}</div>`)}

function renderHeader(){const e=emp();userLabel.textContent=e?`${e.name} · ${e.role==='admin'?'Yönetici':'Personel'}`:'Giriş yap';const logo=state.settings.logoData||DEFAULT_LOGO;logoBox.innerHTML=`<img src="${logo}" alt="Onur Teknik">`;helloText.textContent=e?`Hoş geldin, ${e.name}`:'Onur Teknik';todayText.textContent=new Intl.DateTimeFormat('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());const dot=document.querySelector('#syncStatus .syncdot');if(dot)dot.className='syncdot'+(remoteReady?' on':(cloudConfig?.databaseURL?' err':''));syncStatus.lastChild.textContent=remoteReady?' Bulut bağlantısı açık':(cloudConfig?.databaseURL?' Bulut bağlantısı kurulamadı':' Bulut bağlantısı kapalı')}
function renderAttendance(){if(!emp()||!can('attendance')){attendanceCard.innerHTML='';return}const a=state.attendance.find(x=>x.employeeId===emp().id&&x.date===todayKey());attendanceCard.innerHTML=`<div class="card" style="margin-bottom:10px"><div class="row"><div><b>🕘 Personel Giriş / Çıkış</b><div class="meta">Giriş: <b>${a?.clockIn?fmtTime(a.clockIn):'—'}</b> · Çıkış: <b>${a?.clockOut?fmtTime(a.clockOut):'—'}</b></div></div><span class="tag ${a?.clockOut?'green':a?.clockIn?'amber':'red'}">${a?.clockOut?'Mesai bitti':a?.clockIn?'Mesai açık':'Giriş bekliyor'}</span></div><div class="attendance" style="margin-top:10px"><button class="btn green" ${a?.clockIn?'disabled':''} onclick="clock('in')">Giriş Saatini Kaydet</button><button class="btn" ${!a?.clockIn||a?.clockOut?'disabled':''} onclick="clock('out')">Çıkış Saatini Kaydet</button></div></div>`}
function clock(kind){if(!emp())return openLogin();let a=state.attendance.find(x=>x.employeeId===emp().id&&x.date===todayKey());if(!a){a={id:uuid(),employeeId:emp().id,name:emp().name,date:todayKey(),clockIn:'',clockOut:''};state.attendance.push(a)}if(kind==='in'&&!a.clockIn)a.clockIn=nowISO();if(kind==='out'&&a.clockIn&&!a.clockOut)a.clockOut=nowISO();save('attendance',a.id,a);addEvent(kind==='in'?'Personel giriş':'Personel çıkış',`${emp().name} ${kind==='in'?'giriş':'çıkış'} saatini kaydetti`,a.id);const t=kind==='in'?fmtTime(a.clockIn):fmtTime(a.clockOut);announce(`${titleTR(emp().name)} ${kind==='in'?'giriş':'çıkış'} saati ${t} olarak kaydedildi.`);renderAll()}
function quickButtons(){const arr=[['appointments','Randevular','▣',true],['services','Servis Kayıtları','▤',can('viewServiceHistory')||can('completeService')],['customers','Müşteriler','👤',can('customerSearch')],['stock','Araç / Depo Stok','◫',can('stockUse')],['attendance','Giriş / Çıkış','◷',can('attendance')],['smartcall','Akıllı Çağrı','☎',can('customerSearch')]];return arr.filter(([, , ,ok])=>ok).map(([k,t,i,ok])=>`<button class="q" onclick="quickGo('${k}',${ok})"><span class="ico">${i}</span>${t}</button>`).join('')}
function quickGo(k,ok){if(!ok)return alert('Bu menü bu kullanıcı için kapalı.');if(k==='appointments')switchView('appointments');else if(k==='services')switchView('services');else if(k==='customers')openCustomerSearch();else if(k==='stock')switchView('stock');else if(k==='attendance')window.scrollTo({top:0,behavior:'smooth'});else if(k==='smartcall')openSmartCall()}
function renderHome(){quickGrid.innerHTML=quickButtons();const today=state.appointments.filter(a=>a.date===todayKey()&&appointmentVisible(a));hsAppt.textContent=today.length;hsDone.textContent=today.filter(x=>x.status==='done').length;hsPending.textContent=today.filter(x=>x.status==='open').length;homeAppointments.innerHTML=today.length?today.slice(0,8).map(apptHTML).join(''):'<div class="empty">Bugün görünür randevu yok.</div>'}
function appointmentVisible(a){if(isAdmin())return true;if(!emp())return false;if(!can('viewTodayAppointments'))return false;if(can('viewAllAppointments'))return true;return a.assigneeId===emp().id||a.assigneeId==='all'}
function setApptFilter(v,btn){apptFilter=v;document.querySelectorAll('#appointmentFilters .chip').forEach(x=>x.classList.remove('active'));btn.classList.add('active');renderAppointments()}
function renderAppointments(){newAppointmentBtn.style.display=can('createAppointment')?'':'none';let arr=state.appointments.filter(appointmentVisible);const now=todayKey();if(apptFilter==='today')arr=arr.filter(a=>a.date===now&&a.status!=='cancelled');if(apptFilter==='upcoming')arr=arr.filter(a=>a.date>=now&&a.status==='open');if(apptFilter==='cancelled')arr=arr.filter(a=>a.status==='cancelled');arr.sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));appointmentList.innerHTML=arr.length?arr.map(apptHTML).join(''):'<div class="empty">Bu bölümde randevu yok.</div>'}
function apptHTML(a){const customer=state.customers.find(c=>c.id===a.customerId);const st=a.status==='done'?['green','Tamamlandı']:a.status==='cancelled'?['red','İptal Edildi']:['amber','Randevu'];return `<div class="item ${a.status==='cancelled'?'dangerline':''}"><div class="row"><div><span class="tag ${st[0]}">${st[1]}</span><b style="display:block;margin-top:6px">${esc(a.customerName||customer?.name||'Müşteri')}</b><div class="meta">${esc(a.date)} · ${esc(a.time||'Saat yok')} · ${esc(a.type||'Servis')}</div><div class="meta">${esc(a.address||customer?.address||'')}</div>${a.status==='cancelled'?`<div class="meta"><b>İptal:</b> ${esc(a.cancelReason||'Neden belirtilmedi')}</div>`:''}</div><button class="btn red sm" onclick="openAppointment('${a.id}')">Aç</button></div></div>`}
function employeeOptions(selected=''){return state.employees.filter(e=>e.active&&e.role!=='admin').map(e=>`<option value="${e.id}" ${e.id===selected?'selected':''}>${esc(e.name)}</option>`).join('')}
function openAppointmentForm(prefCustomer=null){if(!can('createAppointment'))return alert('Yeni randevu oluşturma yetkin yok.');const c=prefCustomer;openSheet('Yeni Randevu',`<div class="block"><h4>Müşteri</h4><label>Ad Soyad</label>${micInput('aName','text','Ad Soyad')}<div class="twocol"><div><label>Telefon</label>${micInput('aPhone','tel','Telefon')}</div><div><label>Telefon 2</label>${micInput('aPhone2','tel','Yakını / ikinci telefon')}</div></div><label>Adres</label>${micInput('aAddress','textarea','Mahalle, cadde, sokak, apartman, no, kat')}</div><div class="block"><h4>Kombi</h4><div class="twocol"><div><label>Marka</label>${micInput('aBrand','text','Vaillant...')}</div><div><label>Model</label>${micInput('aModel','text','Model')}</div></div></div><div class="block"><h4>Randevu</h4><div class="twocol"><div><label>Tarih</label><input id="aDate" type="date" value="${todayKey()}"></div><div><label>Saat</label><input id="aTime" type="time"></div></div><label>İşlem</label><select id="aType"><option>Arıza</option><option>Bakım</option><option>Montaj / Değişim</option><option>Kontrol</option></select><label>Müşterinin söylediği arıza / not</label>${micInput('aIssue','textarea','Müşteri ne söyledi?')}<label>Teknisyen</label><select id="aWho"><option value="all">Tüm ekip</option>${employeeOptions('')}</select></div><div class="actions"><button class="btn red" onclick="saveAppointment()">Randevuyu Kaydet</button></div>`);if(c){document.getElementById('aName').value=c.name||'';document.getElementById('aPhone').value=c.phone||'';document.getElementById('aPhone2').value=c.phone2||'';document.getElementById('aAddress').value=c.address||'';document.getElementById('aBrand').value=c.deviceBrand||'';document.getElementById('aModel').value=c.deviceModel||'';sheetBody.dataset.customerId=c.id}}
function saveAppointment(){const name=titleTR(formVal('aName')),phone=formVal('aPhone'),phone2=formVal('aPhone2'),address=cleanAddress(formVal('aAddress')),date=formVal('aDate'),deviceBrand=titleTR(formVal('aBrand')),deviceModel=formVal('aModel');if(!name||!date)return alert('Müşteri adı ve tarih gerekli.');let customer=findCustomerMatch(name,phone,address);if(!customer){if(!can('createCustomer'))return alert('Bu müşteri kayıtlı değil ve yeni müşteri oluşturma yetkin yok.');customer={id:uuid(),name,phone,phone2,address,deviceBrand,deviceModel,createdAt:nowISO(),createdBy:currentName(),active:true};state.customers.unshift(customer);save('customers',customer.id,customer)}else{customer.name=name||customer.name;customer.phone=phone||customer.phone;customer.phone2=phone2||customer.phone2;customer.address=address||customer.address;customer.deviceBrand=deviceBrand||customer.deviceBrand;customer.deviceModel=deviceModel||customer.deviceModel;save('customers',customer.id,customer)}const a={id:uuid(),customerId:customer.id,customerName:customer.name,phone:phone||customer.phone,phone2:phone2||customer.phone2,address:address||customer.address,deviceBrand:deviceBrand||customer.deviceBrand,deviceModel:deviceModel||customer.deviceModel,date,time:formVal('aTime'),type:formVal('aType'),issue:formVal('aIssue'),assigneeId:formVal('aWho')||'all',status:'open',createdAt:nowISO(),createdBy:currentName()};state.appointments.push(a);save('appointments',a.id,a);addEvent('Yeni randevu',`${currentName()}: ${a.customerName} · ${date} ${a.time||''}`,a.id);closeSheet();renderAll();announce(shortAppointmentAnnouncement(a))}
function openAppointment(id){const a=state.appointments.find(x=>x.id===id);if(!a)return;const c=state.customers.find(x=>x.id===a.customerId);const hist=state.serviceRecords.filter(s=>s.customerId===a.customerId).sort((x,y)=>String(y.createdAt).localeCompare(String(x.createdAt)));const history=can('viewCustomerHistory')?(hist.length?hist.slice(0,12).map(s=>`<div class="meta" style="padding:6px 0;border-bottom:1px dashed #ddd"><b>${fmtDate(s.createdAt)}</b> · ${esc(s.workDone||s.issue||'Servis')}</div>`).join(''):'<div class="meta">Geçmiş servis yok.</div>'):'<div class="notice">Bu kullanıcı müşteri geçmişini göremez.</div>';const status=a.status==='done'?'Tamamlandı':a.status==='cancelled'?'İptal Edildi':'Randevu';openSheet('ONUR TEKNİK - SERVİS / RANDEVU FİŞİ',`<div class="ticket"><div class="ticketTitle">ONUR TEKNİK - SERVİS / RANDEVU FİŞİ</div><div class="ticketrow two"><div class="k">TARİH</div><div class="v">${esc(a.date)}</div><div class="k">${esc(a.type||'SERVİS').toUpperCase()}</div><div class="v">${esc(status)}</div></div><div class="ticketrow two"><div class="k">GÜN</div><div class="v">${new Intl.DateTimeFormat('tr-TR',{weekday:'long'}).format(new Date(a.date+'T12:00:00'))}</div><div class="k">SAAT</div><div class="v">${esc(a.time||'—')}</div></div><div class="ticketrow"><div class="k">İLETİŞİM NOTU</div><div class="v">${esc(a.issue||'—')}</div></div><div class="ticketrow"><div class="k">AD SOYAD</div><div class="v">${esc(a.customerName||c?.name||'')}</div></div><div class="ticketrow"><div class="k">ADRES</div><div class="v">${esc(a.address||c?.address||'—')}</div></div><div class="ticketrow"><div class="k">TEL</div><div class="v">${esc(a.phone||c?.phone||'—')}</div></div><div class="ticketrow"><div class="k">TEL 2</div><div class="v">${esc(a.phone2||c?.phone2||'—')}</div></div><div class="ticketrow"><div class="k">MARKA</div><div class="v">${esc(a.deviceBrand||c?.deviceBrand||'—')}</div></div><div class="ticketrow"><div class="k">MODEL</div><div class="v">${esc(a.deviceModel||c?.deviceModel||'—')}</div></div><div class="ticketrow"><div class="k">YAPILAN İŞLEM</div><div class="v">${history}</div></div><div class="ticketrow"><div class="k">TEKNİSYEN</div><div class="v">${esc(state.employees.find(e=>e.id===a.assigneeId)?.name||(a.assigneeId==='all'?'Tüm ekip':'—'))}</div></div></div>${a.status==='cancelled'?`<div class="cancelBox"><b>Randevu iptal edildi:</b> ${esc(a.cancelReason||'Neden belirtilmedi')}<div class="meta">${a.cancelledAt?fmtDateTime(a.cancelledAt):''}</div></div>`:''}<div class="actions"><button class="btn light" onclick="callPhone('${esc(a.phone||c?.phone||'')}')">📞 Ara</button><button class="btn red" onclick="goMaps('${encodeURIComponent(a.address||c?.address||'')}')">📍 Adrese Git</button></div>${a.status==='open'?`<div class="actions"><button class="btn red" onclick="openServiceFromAppointment('${a.id}')">Servis Formunu Aç</button><button class="btn outline" onclick="openCancelAppointment('${a.id}')">Randevuyu İptal Et</button></div>`:''}`)}
function openCancelAppointment(id){const a=state.appointments.find(x=>x.id===id);if(!a||a.status!=='open')return;openSheet('Randevuyu İptal Et',`<div class="notice">Randevu aktif listeden kalkacak, ancak “İptal Edilenler” bölümünde nedeni ile saklanacak.</div><label>İptal nedeni</label><select id="cancelPreset"><option value="">İptal nedeni seç</option><option>Müşteri iptal etti</option><option>Müşteri evde olmayacak</option><option>Kombi düzeldi</option><option>Başka servis çağırdı</option><option>Randevu ertelendi</option><option>Diğer</option></select><label>Açıklama</label>${micInput('cancelNote','textarea','İstersen ek not yaz veya konuş')}<div class="actions"><button class="btn red" onclick="cancelAppointment('${id}')">İptal Olarak Kapat</button></div>`)}
function cancelAppointment(id){const a=state.appointments.find(x=>x.id===id);if(!a)return;const note=formVal('cancelNote'),preset=formVal('cancelPreset');if(!preset&&!note)return alert('İptal nedenini seç veya açıklama yaz.');a.status='cancelled';a.cancelReason=[preset,note].filter(Boolean).join(' - ');a.cancelledAt=nowISO();a.cancelledBy=currentName();save('appointments',a.id,a);addEvent('Randevu iptal',`${a.customerName}: ${a.cancelReason}`,a.id);closeSheet();renderAll();announce(`${titleTR(a.customerName)} için randevu iptal edildi. İptal nedeni: ${note||preset}.`)}
function callPhone(p){if(p)location.href='tel:'+p}function goMaps(q){if(q)location.href='https://www.google.com/maps/search/?api=1&query='+q}
function openCustomerSearch(){if(!can('customerSearch'))return alert('Müşteri arama yetkin yok.');openSheet('Müşteri Ara',`<div class="search"><input id="custQ" placeholder="İsim, telefon, adres, bina adı"><button class="btn" onclick="renderCustomerSearch()">Ara</button></div><div id="custResults" class="list" style="margin-top:10px"></div>`)}
function renderCustomerSearch(){const q=formVal('custQ');const nq=normText(q),qd=digits(q);let arr=state.customers.filter(c=>c.active!==false).map(c=>({c,score:customerMatchScore(c,nq,qd)})).filter(x=>!q||x.score>0).sort((a,b)=>b.score-a.score).slice(0,50);custResults.innerHTML=arr.length?arr.map(({c,score})=>`<div class="item"><div class="row"><div><b>${esc(c.name)}</b><div class="meta">${esc(c.phone||'')} · ${esc(c.address||'')}</div>${q?`<div class="meta">Eşleşme puanı: ${Math.min(100,score)}%</div>`:''}</div><div><button class="btn light sm" onclick="openCustomer('${c.id}')">Aç</button>${can('createAppointment')?` <button class="btn red sm" onclick="appointmentForCustomer('${c.id}')">Randevu</button>`:''}</div></div></div>`).join(''):'<div class="empty">Eşleşme yok.</div>'}
function appointmentForCustomer(id){const c=state.customers.find(x=>x.id===id);if(c)openAppointmentForm(c)}
function openCustomer(id){if(!can('viewCustomerHistory'))return alert('Müşteri geçmişini görme yetkin yok.');const c=state.customers.find(x=>x.id===id);if(!c)return;const hist=state.serviceRecords.filter(s=>s.customerId===id).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));const last=hist[0];openSheet(c.name,`<div class="block"><h4>İletişim</h4><div class="meta"><b>${esc(c.phone||'—')}</b>${c.phone2?` · ${esc(c.phone2)}`:''}</div><div class="meta">${esc(c.address||'—')}</div>${last?`<div class="notice ok" style="margin-top:9px"><b>Son servis:</b> ${fmtDate(last.createdAt)} · ${esc(last.workDone||last.issue||'Servis')}</div>`:''}<div class="actions"><button class="btn light" onclick="callPhone('${esc(c.phone||'')}')">Ara</button><button class="btn red" onclick="goMaps('${encodeURIComponent(c.address||'')}')">Adrese Git</button></div></div><div class="block"><h4>Servis Geçmişi · ${hist.length} kayıt</h4>${hist.length?hist.map(s=>`<div class="item" style="margin-bottom:8px"><div class="row"><div><b>${fmtDate(s.createdAt)} · ${esc(s.workDone||s.issue||'Servis')}</b><div class="meta">${esc(s.deviceBrand||'')} ${esc(s.deviceModel||'')}</div></div><button class="btn light sm" onclick="openService('${s.id}')">Aç / Yazdır</button></div></div>`).join(''):'<div class="empty">Henüz servis kaydı yok.</div>'}</div>${isAdmin()?`<div class="actions"><button class="btn light" onclick="setCustomerPassive('${c.id}')">Pasife Al</button><button class="btn outline" onclick="deleteCustomerPermanent('${c.id}')">Kalıcı Sil</button></div>`:''}`)}
function setCustomerPassive(id){const c=state.customers.find(x=>x.id===id);if(!c)return;if(!confirm(`${c.name} aktif müşteri aramalarından kaldırılsın mı? Geçmiş kayıtlar korunur.`))return;c.active=false;c.passiveAt=nowISO();save('customers',c.id,c);closeSheet();renderAll()}

function normText(v){return String(v||'').toLocaleLowerCase('tr-TR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i').replace(/[^a-z0-9çğıöşü\s]/gi,' ').replace(/\s+/g,' ').trim()}
function digits(v){return String(v||'').replace(/\D/g,'')}
function tokenSet(v){return new Set(normText(v).split(' ').filter(x=>x.length>2))}
function customerMatchScore(c,nq,qd){let score=0;const cp=digits(c.phone),cp2=digits(c.phone2);if(qd&&((cp&&cp.endsWith(qd.slice(-7)))||(cp2&&cp2.endsWith(qd.slice(-7)))))score+=75;const n=normText(c.name),a=normText(c.address);if(nq){if(n&&nq.includes(n))score+=45;const qTokens=tokenSet(nq),nTokens=tokenSet(n),aTokens=tokenSet(a);let nh=0,ah=0;nTokens.forEach(x=>{if(qTokens.has(x))nh++});aTokens.forEach(x=>{if(qTokens.has(x))ah++});score+=Math.min(30,nh*12)+Math.min(28,ah*5);if(c.deviceBrand&&nq.includes(normText(c.deviceBrand)))score+=8}return Math.min(100,score)}
function addDaysKey(n){const d=new Date();d.setDate(d.getDate()+n);return todayKey(d)}
function parseCallText(raw,phone){
  const orig=String(raw||'').trim(), txt=normText(orig);
  let name='',address='',brand='',model='',date='',time='',timeNote='',followUpNote='',issue='';
  const brands=['demirdöküm','demirdokum','vaillant','baymak','eca','e.c.a','bosch','buderus','viessmann','ferroli','ariston','protherm','warmhaus','airfel','alarko','immergas','beko','arçelik','arcelik'];
  let brandIndex=-1;
  for(const b of brands){
    const nb=normText(b), idx=txt.indexOf(nb);
    if(idx>=0){
      brandIndex=idx;
      brand=b.replace('demirdokum','Demirdöküm').replace('demirdöküm','Demirdöküm').replace(/^eca$/,'ECA').replace(/^e\.c\.a$/,'ECA');
      brand=brand.split(' ').map(x=>x.charAt(0).toLocaleUpperCase('tr-TR')+x.slice(1)).join(' ');
      break;
    }
  }
  const mname=orig.match(/(?:adım|adim|ismim|benim adım|benim adim)\s+([A-Za-zÇĞİÖŞÜçğıöşü]+(?:\s+[A-Za-zÇĞİÖŞÜçğıöşü]+){0,2})/i);
  if(mname) name=mname[1].trim();
  if(!name && brandIndex>0){
    const before=orig.slice(0, Math.min(orig.length, brandIndex)).replace(/[,:;.]+$/,'').trim();
    const words=before.split(/\s+/).filter(Boolean);
    if(words.length>=2 && words.length<=4 && words.every(w=>/^[A-Za-zÇĞİÖŞÜçğıöşü'-]+$/.test(w))) name=before;
  }
  if(!name){
    const lead=orig.match(/^([A-Za-zÇĞİÖŞÜçğıöşü'-]+\s+[A-Za-zÇĞİÖŞÜçğıöşü'-]+)(?=\s|,)/);
    if(lead && !/^(bugün|yarın|sabah|akşam|kombi|adres)\b/i.test(lead[1])) name=lead[1].trim();
  }
  if(txt.includes('obur gun')||txt.includes('öbür gün')) date=addDaysKey(2);
  else if(txt.includes('yarin')) date=addDaysKey(1);
  else if(txt.includes('bugun')) date=todayKey();
  if(txt.includes('ogleden once')) timeNote='Öğleden önce';
  else if(txt.includes('ogleden sonra')) timeNote='Öğleden sonra';
  else if(txt.includes('sabah')) timeNote='Sabah';
  else if(txt.includes('aksam')) timeNote='Akşam';
  const rawRange=orig.match(/(?:saat\s*)?(\d{1,2})\s*(?:[-–—_\/]|ile|ila)\s*(\d{1,2})(?:\s*gibi)?/i);
  const softRange=!rawRange?txt.match(/\b(\d{1,2})\s+(\d{1,2})\s+gibi\b/):null;
  const range=rawRange||softRange;
  if(range){
    let h1=Number(range[1]),h2=Number(range[2]);
    if(timeNote==='Öğleden sonra'||timeNote==='Akşam'){if(h1<12)h1+=12;if(h2<12)h2+=12}else if(!timeNote&&h1>=1&&h1<=7&&h2>=1&&h2<=8){h1+=12;h2+=12}
    time=String(h1).padStart(2,'0')+':00–'+String(h2).padStart(2,'0')+':00';
  }else{
    const tm=orig.match(/saat\s*(\d{1,2})(?:[\.:](\d{1,2}))?/i);
    if(tm){let h=Number(tm[1]),mi=Number(tm[2]||0);if(timeNote==='Öğleden sonra'&&h<12)h+=12;time=String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0')}
  }
  if(/gelmeden\s+ara|gelmeden\s+arayın|gelmeden\s+arayin|gelmeden\s+ararız|gelmeden\s+arariz/i.test(orig)) followUpNote='Gelmeden ara';
  const addrStart=orig.search(/\b[A-Za-zÇĞİÖŞÜçğıöşü0-9'.-]+\s+(?:mahallesi|mah\.?)/i);
  if(addrStart>=0){
    let tail=orig.slice(addrStart);
    const stop=tail.search(/\s+(?:\d{4}-\d{2}-\d{2}|\d{1,2}[.\/-]\d{1,2}[.\/-]\d{2,4}|yarın|yarin|bugün|bugun|öbür\s+gün|obur\s+gun|öğleden|ogleden|sabah|akşam|aksam|saat\s*\d|gelmeden\s+ara|\d{1,2}\s*(?:[-–—_\/]|ile|ila)\s*\d{1,2})/i);
    if(stop>0) tail=tail.slice(0,stop);
    address=tail.replace(/[,.]+$/,'').trim();
  }
  if(!address){
    const addrMatch=orig.match(/((?:[A-Za-zÇĞİÖŞÜçğıöşü0-9'.-]+\s+){0,5}(?:mahallesi|mah\.?|caddesi|cad\.?|sokak|sokağı|sokagi|apartmanı|apartmani|apt\.?)[^,.!?]*)/i);
    if(addrMatch)address=cleanAddress(addrMatch[1].trim());
  }
  const issues=[
    /sıcak\s*su\s*(?:vermiyor|gelmiyor)/i,/sicak\s*su\s*(?:vermiyor|gelmiyor)/i,/su\s*kaçırıyor/i,/su\s*kaciriyor/i,
    /çalışmıyor/i,/calismiyor/i,/ısıtmıyor/i,/isitmiyor/i,/ateşleme\s*yapmıyor/i,/atesleme\s*yapmiyor/i,
    /basınç\s*düşüyor/i,/basinc\s*dusuyor/i,/ses\s*yapıyor/i,/ses\s*yapiyor/i,/hata\s*veriyor/i
  ];
  for(const rx of issues){const m=orig.match(rx);if(m){issue=m[0];break}}
  if(!issue) issue=orig;
  address=cleanAddress(address);name=titleTR(name);brand=titleTR(brand);return {raw:orig,phone:digits(phone)||digits(orig.match(/(?:\+?90\s*)?(?:0?5\d{2})[\s.-]*\d{3}[\s.-]*\d{2}[\s.-]*\d{2}/)?.[0]||''),name,address,brand,model,date,time,timeNote,followUpNote,issue};
}
function smartCandidates(d){const nq=normText([d.raw,d.name,d.address,d.brand].filter(Boolean).join(' ')),qd=digits(d.phone);return state.customers.filter(c=>c.active!==false).map(c=>({c,score:customerMatchScore(c,nq,qd)})).filter(x=>x.score>=18).sort((a,b)=>b.score-a.score).slice(0,5)}
function lastCustomerService(id){return state.serviceRecords.filter(s=>s.customerId===id).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)))[0]||null}
function openSmartCall(){if(!can('customerSearch'))return alert('Müşteri arama yetkin yok.');openSheet('Akıllı Çağrı / Müşteri Tanıma',`<div class="notice info"><b>FINAL:</b> Arayan numarayı biliyorsan yaz; bilmiyorsan görüşme özetini söyle. Sistem isim, adres, kombi, arıza ve randevu ifadelerini ayırıp mevcut müşteriyle eşleştirmeye çalışır. Hiçbir kayıt sen onaylamadan kaydedilmez.</div><label>Arayan telefon (varsa)</label><input id="callPhone" type="tel" inputmode="tel" placeholder="05xx xxx xx xx"><label>Görüşme özeti</label>${micInput('callSummary','textarea','Örnek: Ahmet Yılmaz, Demirdöküm kombi su kaçırıyor, Hürriyet Mahallesi Gülseren Sokak 15, yarın öğleden sonra 3-4 gibi...')}<div class="actions"><button class="btn red" onclick="analyzeSmartCall()">Görüşmeyi Analiz Et</button></div><div id="smartResult"></div><div class="callHint" style="margin-top:10px">Yönlendirmeyle gelen 2061 / 5656 / 4986 çağrılarında hangi Onur Teknik hattının arandığı telefonda görünmüyorsa program bunu uydurmaz. Eşleştirme arayan kişi ve görüşme bilgisinden yapılır.</div>`)}
function analyzeSmartCall(){const d=parseCallText(formVal('callSummary'),formVal('callPhone'));smartDraft=d;const cand=smartCandidates(d);let html=`<div class="smartResult"><b>Çıkarılan Bilgiler</b><div class="smartFields"><div class="sf"><b>Ad Soyad</b>${esc(d.name||'Henüz çıkarılamadı')}</div><div class="sf"><b>Telefon</b>${esc(d.phone||'Yok')}</div><div class="sf"><b>Kombi</b>${esc([d.brand,d.model].filter(Boolean).join(' ')||'Bilinmiyor')}</div><div class="sf"><b>Arıza</b>${esc(d.issue||'Belirtilmedi')}</div><div class="sf"><b>Randevu</b>${esc([d.date,d.time||d.timeNote].filter(Boolean).join(' · ')||'Belirtilmedi')}</div><div class="sf"><b>Ek Not</b>${esc(d.followUpNote||'Yok')}</div><div class="sf" style="grid-column:1/-1"><b>Adres</b>${esc(d.address||'Henüz çıkarılamadı')}</div></div></div>`;if(cand.length){html+=`<div class="section" style="margin-top:14px"><h2>Muhtemel Müşteriler</h2></div>`+cand.map(({c,score},i)=>{const last=lastCustomerService(c.id);return `<div class="smartResult"><div class="row"><div><span class="smartScore">${score}% eşleşme</span><b style="display:block;margin-top:6px">${esc(c.name)}</b><div class="meta">${esc(c.phone||'')} · ${esc(c.address||'')}</div>${last?`<div class="miniHistory"><b>Son geliş:</b> ${fmtDate(last.createdAt)} · ${esc(last.workDone||last.issue||'Servis')}</div>`:'<div class="meta">Servis geçmişi yok.</div>'}</div><button class="btn red sm" onclick="useSmartCustomer('${c.id}')">Bu Müşteri</button></div></div>`}).join('')}else html+=`<div class="notice" style="margin-top:10px">Mevcut müşteri eşleşmesi bulunamadı. Yeni müşteri/randevu taslağı oluşturabilirsin.</div>`;html+=`<div class="actions"><button class="btn light" onclick="openSmartDraftEdit()">Bilgileri Düzenle</button><button class="btn red" onclick="useSmartCustomer('')">Yeni Müşteri / Randevu</button></div>`;smartResult.innerHTML=html}
function openSmartDraftEdit(){const d=smartDraft||{};openSheet('Görüşme Taslağını Düzenle',`<label>Ad Soyad</label><input id="sdName" value="${esc(d.name||'')}"><label>Telefon</label><input id="sdPhone" value="${esc(d.phone||'')}"><label>Adres</label><textarea id="sdAddress">${esc(d.address||'')}</textarea><div class="twocol"><div><label>Marka</label><input id="sdBrand" value="${esc(d.brand||'')}"></div><div><label>Model</label><input id="sdModel" value="${esc(d.model||'')}"></div></div><label>Arıza</label><textarea id="sdIssue">${esc(d.issue||'')}</textarea><div class="twocol"><div><label>Tarih</label><input id="sdDate" type="date" value="${esc(d.date||todayKey())}"></div><div><label>Saat / Saat Aralığı</label><input id="sdTime" type="text" placeholder="15:00 veya 15:00–16:00" value="${esc(d.time||'')}"></div></div><label>Gün bölümü</label><input id="sdTimeNote" value="${esc(d.timeNote||'')}"><label>Ek Not</label><input id="sdFollowUp" value="${esc(d.followUpNote||'')}"><div class="actions"><button class="btn red" onclick="saveSmartDraftEdit()">Taslağı Kaydet</button></div>`)}
function saveSmartDraftEdit(){smartDraft={...(smartDraft||{}),name:formVal('sdName'),phone:digits(formVal('sdPhone')),address:formVal('sdAddress'),brand:formVal('sdBrand'),model:formVal('sdModel'),issue:formVal('sdIssue'),date:formVal('sdDate'),time:formVal('sdTime'),timeNote:formVal('sdTimeNote'),followUpNote:formVal('sdFollowUp')};useSmartCustomer('')}
function useSmartCustomer(id){if(!can('createAppointment'))return alert('Randevu oluşturma yetkin yok.');const c=id?state.customers.find(x=>x.id===id):null;const d=smartDraft||{};openAppointmentForm(c||null);setTimeout(()=>{if(!c){if(document.getElementById('aName'))aName.value=d.name||'';if(document.getElementById('aPhone'))aPhone.value=d.phone||'';if(document.getElementById('aAddress'))aAddress.value=d.address||'';if(document.getElementById('aBrand'))aBrand.value=d.brand||'';if(document.getElementById('aModel'))aModel.value=d.model||''}if(document.getElementById('aIssue'))aIssue.value=d.issue||'';if(document.getElementById('aDate')&&d.date)aDate.value=d.date;if(document.getElementById('aTime')&&/^\d{2}:\d{2}$/.test(d.time||''))aTime.value=d.time;const extra=[d.time&&d.time.includes('–')?`Saat aralığı: ${d.time}`:'',d.timeNote?`Zaman notu: ${d.timeNote}`:'',d.followUpNote?`Not: ${d.followUpNote}`:'',c&&c.address?`Kayıtlı adres teyit edilecek: ${c.address}`:''].filter(Boolean).join('\n');if(extra&&document.getElementById('aIssue'))aIssue.value=(aIssue.value?aIssue.value+'\n':'')+extra},50)}
function deleteServiceRecord(id){if(!isAdmin())return;const s=state.serviceRecords.find(x=>x.id===id);if(!s)return;if(!confirm(`${s.customerName} adına #${s.serviceNo||''} servis kaydı silinsin mi?\n\nBu işlem geri alınamaz. Önce yedek almak güvenlidir.`))return;if(!confirm('Son onay: Yalnız bu servis kaydı kalıcı silinecek. Devam edilsin mi?'))return;state.serviceRecords=state.serviceRecords.filter(x=>x.id!==id);if(s.appointmentId){const a=state.appointments.find(x=>x.id===s.appointmentId);if(a){a.status='open';delete a.serviceId;delete a.completedAt;save('appointments',a.id,a)}}state.maintenanceReminders=(state.maintenanceReminders||[]).filter(x=>x.serviceId!==id);save('serviceRecords',id,null,true);saveLocal();closeSheet();renderAll();alert('Servis kaydı silindi. Müşteri kartı ayrıca duruyor.')}
function openCustomerPool(){if(!isAdmin())return;openSheet('Müşteri Havuzu',`<div class="notice info">Akıllı Çağrı, Cep Asistanı içindeki müşteri havuzunda arama yapar. Mevcut eski müşteri listesini bir kez JSON veya CSV olarak içe aktarabiliriz. Bu işlem servis/muhasebe kaydı oluşturmaz.</div><div class="block"><h4>Şu anki müşteri sayısı</h4><div class="poolCount">${state.customers.filter(c=>c.active!==false).length.toLocaleString('tr-TR')} müşteri</div></div><input id="poolFile" class="hidden" type="file" accept=".json,.csv,.txt,application/json,text/csv" onchange="importCustomerPool(this.files[0])"><div class="actions"><button class="btn red" onclick="document.getElementById('poolFile').click()">Müşteri Listesi İçe Aktar</button></div><div class="callHint" style="margin-top:10px">Desteklenen temel alanlar: Ad Soyad, Telefon, Telefon 2, Adres, Marka, Model. İçe aktarmadan önce kaç yeni müşteri bulunacağı gösterilir.</div>`)}
function csvRows(text){const first=(text.split(/\r?\n/)[0]||'');const sep=first.includes(';')?';':first.includes('\t')?'\t':',';const lines=text.split(/\r?\n/).filter(x=>x.trim());if(lines.length<2)return[];const headers=lines[0].split(sep).map(x=>normText(x));return lines.slice(1).map(line=>{const vals=line.split(sep).map(x=>x.trim().replace(/^"|"$/g,''));const o={};headers.forEach((h,i)=>o[h]=vals[i]||'');return o})}
function firstVal(o,keys){for(const k of keys){if(o&&o[k]!=null&&String(o[k]).trim())return String(o[k]).trim();const nk=normText(k);for(const ok of Object.keys(o||{})){if(normText(ok)===nk&&String(o[ok]||'').trim())return String(o[ok]).trim()}}return''}
function normalizeImportedCustomer(o){let name=firstVal(o,['name','ad soyad','adsoyad','ad_soyad','müşteri','musteri','müşteri adı','musteri adi']);if(!name){const ad=firstVal(o,['ad','isim']),soy=firstVal(o,['soyad','soy isim','soyisim']);name=[ad,soy].filter(Boolean).join(' ')}return {name,phone:firstVal(o,['phone','telefon','tel','cep','gsm','telefon 1']),phone2:firstVal(o,['phone2','telefon 2','tel2','ikinci telefon']),address:firstVal(o,['address','adres','açık adres','acik adres']),deviceBrand:firstVal(o,['deviceBrand','marka','kombi marka','kombi markası']),deviceModel:firstVal(o,['deviceModel','model','kombi model'])}}
function importCustomerPool(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{let rows=[];const text=String(r.result||'');if(file.name.toLowerCase().endsWith('.json')||text.trim().startsWith('{')||text.trim().startsWith('[')){const p=JSON.parse(text);rows=Array.isArray(p)?p:(p.customers||p.musteriler||p.state?.customers||p.data?.customers||[])}else rows=csvRows(text);const clean=rows.map(normalizeImportedCustomer).filter(x=>x.name||x.phone||x.address);let add=[];for(const x of clean){const pd=digits(x.phone);const dup=state.customers.find(c=>(pd&&digits(c.phone).endsWith(pd.slice(-7)))||(normText(c.name)===normText(x.name)&&normText(c.address)===normText(x.address)&&x.name));if(!dup)add.push(x)}if(!clean.length)return alert('Bu dosyada tanınabilir müşteri alanı bulunamadı.');if(!confirm(`${clean.length.toLocaleString('tr-TR')} satır okundu.\n${add.length.toLocaleString('tr-TR')} yeni müşteri eklenecek.\n\nDevam edilsin mi?`))return;add.forEach(x=>state.customers.push({id:uuid(),...x,active:true,createdAt:nowISO(),createdBy:'Müşteri Havuzu İçe Aktarım',source:'legacy-import'}));saveLocal();closeSheet();renderAll();alert(`${add.length.toLocaleString('tr-TR')} müşteri havuza eklendi.`)}catch(e){console.error(e);alert('Müşteri listesi okunamadı. Dosya biçimini kontrol edelim.')}};r.readAsText(file,'utf-8')}

function openPCExport(){if(!can('pcExport'))return;openSheet('PC’ye Aktar',`<div class="notice info">İstersen 3-5 gün sonra belirli bir günü seçip yalnız o günkü servisleri aktarabilirsin. Daha önce aktarılan kayıtlar tekrar eklenmez.</div><label>Aktarılacak tarih</label><input id="pcDate" type="date" value="${todayKey()}"><div class="actions"><button class="btn red" onclick="exportPCDate()">Bu Günü PC’ye Aktar</button></div>`)}
function exportPCDate(){const d=formVal('pcDate');const rows=state.serviceRecords.filter(s=>todayKey(new Date(s.createdAt))===d&&!s.pcExported);if(!rows.length)return alert('Bu tarihte aktarılmayı bekleyen servis yok.');const pack={format:'ONUR_TEKNIK_SERVIS_AKTARIM_VNEXT',version:2,date:d,exportedAt:nowISO(),services:rows.map(s=>({...s,invoicePending:s.invoicePending??s.payment==='Havale'}))};const blob=new Blob([JSON.stringify(pack,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ONUR_TEKNIK_SERVIS_'+d+'.json';a.click();URL.revokeObjectURL(url);rows.forEach(s=>{s.pcExported=true;s.pcExportedAt=nowISO();save('serviceRecords',s.id,s)});alert(rows.length+' servis PC aktarımı için hazırlandı.')}
function openQuickAdd(){if(!emp())return openLogin();const buttons=[];if(can('createAppointment'))buttons.push(`<button class="btn red" onclick="openAppointmentForm()">Yeni Randevu</button>`);if(can('customerSearch'))buttons.push(`<button class="btn" onclick="openSmartCall()">Akıllı Çağrı / Görüşme Özeti</button>`);if(can('completeService'))buttons.push(`<button class="btn" onclick="openStandaloneService()">Yeni Servis Kaydı</button>`);if(can('customerSearch'))buttons.push(`<button class="btn light" onclick="openCustomerSearch()">Müşteri Ara</button>`);openSheet('Hızlı İşlem',`<div class="actions" style="flex-direction:column">${buttons.join('')||'<div class="notice">Bu kullanıcı için hızlı kayıt menüsü kapalı.</div>'}</div>`)}
function openSyncSheet(){if(!isAdmin())return;openSheet('Ortak Telefon Senkronu',`<div class="notice info">Mevcut Onur Teknik Firebase projesini kullanır. Aynı çalışma kodu ile tüm telefonlar ortak kayıt görür. Firebase şifresi telefonda kaydedilmez; yalnız bağlantı kurulurken kullanılır.</div><label>Çalışma kodu</label><input id="fWorkspace" value="${esc(cloudConfig.workspace||'ONURTEKNIK')}"><label>Firebase giriş e-postası</label><input id="fEmail" type="email" autocomplete="username" value="${esc(cloudConfig.email||'')}"><label>Firebase şifresi</label><input id="fPassword" type="password" autocomplete="current-password" placeholder="Şifrenizi girin"><label>Firebase API Key</label><input id="fApi" value="${esc(cloudConfig.apiKey||'')}"><label>Auth Domain</label><input id="fAuth" value="${esc(cloudConfig.authDomain||'')}"><label>Database URL</label><input id="fDb" value="${esc(cloudConfig.databaseURL||'')}"><label>Project ID</label><input id="fProject" value="${esc(cloudConfig.projectId||'')}"><label>App ID</label><input id="fApp" value="${esc(cloudConfig.appId||'')}"><div class="actions"><button class="btn red" onclick="saveCloudConfig()">Kaydet ve Bağlan</button></div>`)}
function saveCloudConfig(){const loginEmail=formVal('fEmail'),loginPassword=document.getElementById('fPassword')?.value||'';cloudConfig={workspace:formVal('fWorkspace')||'ONURTEKNIK',email:loginEmail,apiKey:formVal('fApi'),authDomain:formVal('fAuth'),databaseURL:formVal('fDb'),projectId:formVal('fProject'),appId:formVal('fApp')};localStorage.setItem(CK,JSON.stringify(cloudConfig));closeSheet();initCloud(loginEmail,loginPassword)}
function setSync(cls,text){syncStatus.innerHTML=`<span class="syncdot ${cls||''}"></span>${esc(text)}`}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function initCloud(loginEmail='',loginPassword=''){if(!cloudConfig.apiKey||!cloudConfig.databaseURL){remoteReady=false;setSync('','Bulut bağlantısı kapalı');return}try{if(!window.firebase){await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js');await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js')}if(!firebase.apps.length)firebase.initializeApp(cloudConfig);const auth=firebase.auth();await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);if(loginEmail&&loginPassword){await auth.signInWithEmailAndPassword(loginEmail,loginPassword)}if(!auth.currentUser){await auth.signInAnonymously()}cloud=firebase.database().ref('workspaces/'+(cloudConfig.workspace||'ONURTEKNIK'));remoteReady=true;setSync('on','Ortak kayıt açık');const sections=['employees','customers','appointments','serviceRecords','stock','attendance','managerEvents','maintenanceReminders'];for(const section of sections){cloud.child(section).on('value',snap=>{let arr=Object.values(snap.val()||{});if(section==='stock')arr=normalizePcStock(arr);if(arr.length||snap.exists()){state[section]=arr;state.employees.forEach(e=>{if(!e.permissions)e.permissions=e.role==='admin'?ALL_PERMS:(e.name?.toLowerCase()==='talha'?TALHA_PERMS:LIMITED_PERMS)});saveLocal();renderAll()}});const snap=await cloud.child(section).once('value');if(section!=='stock'&&!snap.exists()&&state[section]?.length){for(const r of state[section])await cloud.child(section+'/'+r.id).set(r)}}cloud.child('settings').on('value',snap=>{if(snap.exists()){state.settings={...state.settings,...snap.val()};saveLocal();renderHeader()}});const ss=await cloud.child('settings').once('value');if(!ss.exists())await cloud.child('settings').set(state.settings)}catch(e){console.error('Firebase bağlantı hatası',e);remoteReady=false;const code=String(e?.code||'');if(code.includes('permission-denied'))setSync('err','Bulut erişim izni yok');else setSync('err','Buluta bağlanamadı · '+code)}}
function renderAll(){renderHeader();renderAttendance();renderHome();renderAppointments();renderServices();renderStock();renderMore()}
bootstrap();renderAll();initCloud();if(!emp())setTimeout(openLogin,250);
</script>
